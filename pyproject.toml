[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bibliograph"
version = "0.1.0"
description = "Semantic citation discovery for Zotero libraries and paper drafts"
requires-python = ">=3.12"
dependencies = [
    "ikarus @ git+ssh://git@github.com/sebastianjkern/ikarus.git",
    "langgraph>=0.2",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
pdf = [
    "PyMuPDF>=1.24",
]
zotero = [
    "pyzotero>=1.5",
]
local-embeddings = [
    "sentence-transformers>=3.0",
]
openai = [
    "openai>=1.40",
]
remote = [
    "doidownloader>=0.1.0",
    "pyDOI>=0.2.1",
    "playwright>=1.50",
]
all = [
    "PyMuPDF>=1.24",
    "pyzotero>=1.5",
    "sentence-transformers>=3.0",
    "openai>=1.40",
    "doidownloader>=0.1.0",
    "pyDOI>=0.2.1",
    "playwright>=1.50",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
bibliograph = "bibliograph.cli:main"

# Use the adjacent checkout while developing Bibliograph and Ikarus together.
# The project dependency above remains Git-based for standalone installations.
[tool.uv.sources]
ikarus = { path = "../ikarus", editable = true }

[tool.setuptools.packages.find]
include = ["bibliograph*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
