[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bibliograph"
version = "0.1.0"
description = "Semantic citation discovery for Zotero libraries and paper drafts"
requires-python = ">=3.12"
dependencies = [
    "ikarus @ git+ssh://git@github.com/sebastianjkern/ikarus.git",
    "docling-core>=2.0",
    "langgraph>=0.2",
    "pillow>=10.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
all = [
    "PyMuPDF>=1.24",
    "pyzotero>=1.5",
    "sentence-transformers>=3.0",
    "openai>=1.40",
    "doidownloader>=0.1.0",
    "pyDOI>=0.2.1",
    "playwright>=1.50",
]
dev = [
    "mypy>=1.13,<2",
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
bibliograph = "bibliograph.cli:main"

# Use the adjacent checkout while developing Bibliograph and Ikarus together.
# The project dependency above remains Git-based for standalone installations.
[tool.uv.sources]
ikarus = { path = "../ikarus", editable = true }

[tool.setuptools.packages.find]
include = ["bibliograph*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
[tool.mypy]
python_version = "3.12"
files = [
    "bibliograph/adapters/ikarus_index.py",
    "bibliograph/adapters/ikarus_records.py",
    "bibliograph/pipeline/evidence_assessment.py",
    "bibliograph/pipeline/evidence_synthesis.py",
    "bibliograph/pipeline/evidence_workflow_utils.py",
    "bibliograph/pipeline/llm_tools.py",
    "bibliograph/settings_validation.py",
]
check_untyped_defs = true
follow_imports = "silent"
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
