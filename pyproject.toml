[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bibliograph"
version = "0.1.0"
description = "Semantic citation discovery for Zotero libraries and paper drafts"
requires-python = ">=3.12"
dependencies = [
    "sqlite-vec>=0.1.9",
    "doidownloader>=0.1.0",
    "pyDOI>=0.2.1",
    "PyMuPDF>=1.24",
    "pyzotero>=1.5",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "openai>=1.40",
    "sentence-transformers>=3.0",
    "streamlit>=1.36",
    "playwright>=1.50",
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
bibliograph = "bibliograph.cli:main"

[tool.setuptools.packages.find]
include = ["bibliograph*", "connections*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
