[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bibliograph"
version = "0.1.0"
description = "Semantic citation discovery for Zotero libraries and paper drafts"
requires-python = ">=3.10"
dependencies = ["sqlite-vec>=0.1.9"]

[project.optional-dependencies]
pdf = ["PyMuPDF>=1.24"]
zotero = ["pyzotero>=1.5", "python-dotenv>=1.0"]
embeddings = ["numpy>=1.26", "openai>=1.40", "sentence-transformers>=3.0"]
llm = ["openai>=1.40"]
ui = ["streamlit>=1.36"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
bibliograph = "bibliograph.cli:main"

[tool.setuptools.packages.find]
include = ["bibliograph*", "connections*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
